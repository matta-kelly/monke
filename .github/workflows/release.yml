# A tag v* makes a GitHub release with dist/monke.tar.gz and SHA256SUMS. The monkeyimage build takes the latest release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/dist.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/monke.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
